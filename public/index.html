<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 Дискорд LUDKA 🎰</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        .header {
            padding: 20px 40px;
            background: linear-gradient(180deg, rgba(10,10,10,1) 0%, rgba(10,10,10,0.7) 100%);
            z-index: 10;
            position: sticky;
            top: 0;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, #f7971e, #ffd200, #f7971e);
            background-size: 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s infinite;
            letter-spacing: 2px;
        }

        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        .header p {
            color: #888;
            font-size: 0.9rem;
            letter-spacing: 3px;
            margin-top: 5px;
        }

        /* ---------- ОСНОВНОЙ КОНТЕЙНЕР ---------- */
        .roulette-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, #1a1a0e 0%, #0a0a0a 100%);
        }

        .roulette-track {
            display: flex;
            gap: 30px;
            padding: 0 50px;
            position: relative;
            will-change: transform;
        }

        /* ---------- КАРТОЧКИ ---------- */
        .card {
            flex: 0 0 280px;
            height: 400px;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            transform: scale(0.85);
            opacity: 0.4;
            filter: blur(3px);
        }

        .card.active {
            transform: scale(1.15);
            opacity: 1;
            filter: blur(0px);
            box-shadow: 0 20px 60px rgba(247, 151, 30, 0.4), 0 0 80px rgba(247, 151, 30, 0.2);
            z-index: 5;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px 20px 20px;
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, transparent 100%);
            transform: translateY(30px);
            opacity: 0;
            transition: all 0.5s ease;
        }

        .card.active .overlay {
            transform: translateY(0);
            opacity: 1;
        }

        .card .overlay h3 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .card .overlay p {
            font-size: 0.9rem;
            color: #ccc;
            opacity: 0.8;
        }

        .card .badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(247, 151, 30, 0.95);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
            transform: scale(0) rotate(-30deg);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .card.active .badge {
            transform: scale(1) rotate(0deg);
        }

        .card.active::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 26px;
            background: linear-gradient(90deg, #f7971e, #ffd200, #f7971e);
            background-size: 300%;
            animation: borderGlow 2s linear infinite;
            z-index: -1;
        }

        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ---------- БЕЛАЯ СТРЕЛКА (треугольник) ---------- */
        .arrow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            pointer-events: none;
        }

        .arrow svg {
            width: 60px;
            height: 60px;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.3));
        }

        /* ---------- ПАНЕЛЬ УПРАВЛЕНИЯ ---------- */
        .user-panel {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            background: rgba(0,0,0,0.85);
            padding: 20px 30px;
            border-radius: 16px;
            border: 1px solid rgba(247, 151, 30, 0.3);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 380px;
            align-items: center;
        }

        .user-panel .row {
            display: flex;
            gap: 12px;
            align-items: center;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .user-panel label {
            color: #ffd200;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .user-panel input {
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: white;
            font-size: 0.95rem;
            min-width: 200px;
            flex: 1;
            transition: all 0.3s ease;
        }

        .user-panel input:focus {
            outline: none;
            border-color: #f7971e;
            box-shadow: 0 0 20px rgba(247, 151, 30, 0.15);
        }

        /* ---------- БАЛАНС ТОКЕНОВ ---------- */
        .balance {
            display: flex;
            gap: 30px;
            align-items: center;
            padding: 8px 20px;
            background: rgba(247, 151, 30, 0.08);
            border-radius: 12px;
            border: 1px solid rgba(247, 151, 30, 0.15);
        }

        .balance-item {
            text-align: center;
        }

        .balance-item .label {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-item .value {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .balance-item .value.tokens {
            font-size: 1.8rem;
        }

        /* ---------- КНОПКИ ---------- */
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .btn {
            padding: 12px 32px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            color: #0a0a0a;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 5px 30px rgba(247, 151, 30, 0.3);
        }

        .btn:hover:not(:disabled) {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 10px 50px rgba(247, 151, 30, 0.5);
        }

        .btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-reset {
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 5px 30px rgba(118, 75, 162, 0.3);
        }

        .btn-reset:hover:not(:disabled) {
            box-shadow: 0 10px 50px rgba(118, 75, 162, 0.5);
        }

        .btn-spin {
            background: linear-gradient(90deg, #f7971e, #ffd200);
        }

        .status {
            color: #ffd200;
            font-size: 0.85rem;
            text-align: center;
            min-height: 24px;
            padding: 4px 12px;
        }

        .status.success {
            color: #57F287;
        }

        .status.error {
            color: #ED4245;
        }

        /* ---------- ПОБЕДНЫЙ ОВЕРЛЕЙ ---------- */
        .win-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 500;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .win-overlay.show {
            opacity: 1;
        }

        .win-text {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(90deg, #f7971e, #ffd200, #f7971e);
            background-size: 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 1s infinite;
            text-shadow: 0 0 60px rgba(247, 151, 30, 0.3);
            transform: scale(0);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .win-overlay.show .win-text {
            transform: scale(1);
        }

        .win-sub {
            font-size: 1.5rem;
            color: #fff;
            -webkit-text-fill-color: white;
            margin-top: 10px;
        }

        .win-tokens {
            font-size: 1.2rem;
            color: #ffd200;
            margin-top: 8px;
        }

        /* ---------- КОНФЕТТИ ---------- */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            opacity: 0;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-100px) rotate(0deg) scale(0);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg) scale(1);
                opacity: 0;
            }
        }

        /* ---------- ФУТЕР ---------- */
        .footer {
            padding: 12px 40px;
            text-align: center;
            color: #333;
            font-size: 0.7rem;
            letter-spacing: 2px;
            background: rgba(10,10,10,0.9);
            border-top: 1px solid #1a1a1a;
        }

        .footer span {
            color: #f7971e;
        }

        /* ---------- АДАПТИВ ---------- */
        @media (max-width: 768px) {
            .card {
                flex: 0 0 200px;
                height: 300px;
            }
            .card.active {
                transform: scale(1.1);
            }
            .header h1 {
                font-size: 1.8rem;
            }
            .user-panel {
                bottom: 100px;
                padding: 15px 20px;
                min-width: unset;
                width: 92%;
            }
            .user-panel .row {
                flex-direction: column;
                align-items: stretch;
            }
            .user-panel input {
                min-width: unset;
                width: 100%;
            }
            .balance {
                gap: 15px;
                padding: 6px 12px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .balance-item .value {
                font-size: 1.2rem;
            }
            .balance-item .value.tokens {
                font-size: 1.4rem;
            }
            .controls {
                gap: 8px;
            }
            .btn {
                padding: 10px 20px;
                font-size: 0.85rem;
            }
            .win-text {
                font-size: 2.5rem;
            }
            .win-sub {
                font-size: 1rem;
            }
            .arrow svg {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>ROLES LLUDKAA</h1>
        <p>ЗАРАБАТЫВАЙ ТОКЕНЫ ЗА СООБЩЕНИЯ · ВЫИГРЫВАЙ РОЛИ</p>
    </div>

    <div class="roulette-wrapper">
        <div class="roulette-track" id="rouletteTrack"></div>

        <!-- БЕЛАЯ СТРЕЛКА (треугольник) -->
        <div class="arrow">
            <svg viewBox="0 0 100 100">
                <polygon points="50,10 90,90 10,90" fill="white" opacity="0.9" />
            </svg>
        </div>
    </div>

    <!-- ПАНЕЛЬ УПРАВЛЕНИЯ -->
    <div class="user-panel" id="userPanel">
        <div class="row">
            <label for="userId">🆔 Имя или ID:</label>
            <input type="text" id="userId" placeholder="Введите имя или ID" />
            <button class="btn btn-check" id="checkBtn">👤 Проверить</button>
        </div>

        <div class="balance" id="balanceDisplay">
            <div class="balance-item">
                <div class="label">💰 Токены</div>
                <div class="value tokens" id="tokensDisplay">0</div>
            </div>
            <div class="balance-item">
                <div class="label">💬 Сообщений</div>
                <div class="value" id="messagesDisplay">0</div>
            </div>
            <div class="balance-item">
                <div class="label">🎯 Спинов</div>
                <div class="value" id="spinsDisplay">0</div>
            </div>
        </div>

        <div class="status" id="statusMessage">⏳ Введите имя и нажмите "Проверить"</div>

        <div class="controls">
            <button class="btn btn-spin" id="startBtn">🎲 Крутить (1 токен)</button>
            <button class="btn btn-reset" id="resetBtn">🔄 Сброс</button>
        </div>
    </div>

    <!-- ПОБЕДНЫЙ ОВЕРЛЕЙ -->
    <div class="win-overlay" id="winOverlay">
        <div class="win-text">
            🎉 ПОБЕДА! 🎉
            <div class="win-sub" id="winSub">Вы выиграли: Горы</div>
            <div class="win-tokens" id="winTokens">💰 Осталось: 0 токенов</div>
        </div>
    </div>

    <div class="confetti-container" id="confettiContainer"></div>

    <div class="footer">
        <span>✦</span> За 10 сообщений = 1 токен · 1 спин = 1 токен <span>✦</span>
    </div>

    <script>
        // ===== НАСТРОЙКИ =====
        const API_URL = '/api';
        let currentUser = null;
        let userTokens = 0;
        let isSpinning = false;
        let isStopping = false;
        let speed = 0;
        let currentX = 0;
        let animationId = null;
        let spinCount = 0;

        // Роли для рулетки
        const items = [
            { name: '🏔️ Роль 1', desc: 'Пиздец', badge: '⭐ ТОП' },
            { name: '🌊 Роль 2', desc: 'Я ебал', badge: '🔥 ХИТ' },
            { name: '🌆 Роль 3', desc: 'Это в рот', badge: '💎 ЛЮКС' },
        ];

        // ===== СОЗДАНИЕ КАРТОЧЕК =====
        const track = document.getElementById('rouletteTrack');
        const cardWidth = 310;
        let totalCards = 0;

        function createCards() {
            const count = Math.max(items.length * 2, 9);
            for (let i = 0; i < count; i++) {
                const idx = i % items.length;
                const item = items[idx];
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = i;
                card.dataset.realIndex = idx;
                const seed = idx + 1;
                card.innerHTML = `
                    <div class="badge">${item.badge}</div>
                    <img src="https://picsum.photos/seed/${seed + i * 13}/600/800" alt="${item.name}">
                    <div class="overlay">
                        <h3>${item.name}</h3>
                        <p>${item.desc}</p>
                    </div>
                `;
                track.appendChild(card);
            }
            totalCards = track.children.length;
        }
        createCards();

        // ===== ФУНКЦИИ РУЛЕТКИ =====
        function findWinnerIndex() {
            const cards = track.querySelectorAll('.card');
            const containerWidth = track.parentElement.clientWidth;
            const centerX = containerWidth / 2;

            let closestCard = null;
            let closestDist = Infinity;

            cards.forEach((card) => {
                const rect = card.getBoundingClientRect();
                const cardCenter = rect.left + rect.width / 2;
                const dist = Math.abs(cardCenter - centerX);
                if (dist < closestDist) {
                    closestDist = dist;
                    closestCard = card;
                }
            });

            cards.forEach(card => card.classList.remove('active'));
            if (closestCard) {
                closestCard.classList.add('active');
                return parseInt(closestCard.dataset.realIndex);
            }
            return 0;
        }

        function updateActiveCard() {
            const cards = track.querySelectorAll('.card');
            const containerWidth = track.parentElement.clientWidth;
            const centerX = containerWidth / 2;

            let closestCard = null;
            let closestDist = Infinity;

            cards.forEach((card) => {
                const rect = card.getBoundingClientRect();
                const cardCenter = rect.left + rect.width / 2;
                const dist = Math.abs(cardCenter - centerX);
                if (dist < closestDist) {
                    closestDist = dist;
                    closestCard = card;
                }
            });

            cards.forEach(card => card.classList.remove('active'));
            if (closestCard) {
                closestCard.classList.add('active');
            }
        }

        function reflowCards() {
            const cards = track.querySelectorAll('.card');
            const firstCard = cards[0];
            const firstRect = firstCard.getBoundingClientRect();

            if (firstRect.right < 0) {
                const movedCard = track.removeChild(firstCard);
                const lastCard = track.lastElementChild;
                const newRealIndex = (parseInt(lastCard.dataset.realIndex) + 1) % items.length;
                movedCard.dataset.realIndex = newRealIndex;
                track.appendChild(movedCard);
                currentX += cardWidth;
                track.style.transform = `translateX(${currentX}px)`;
            }
        }

        // ===== ТОКЕНЫ =====
        async function checkUser() {
            const userId = document.getElementById('userId').value.trim();
            if (!userId) {
                setStatus('❌ Введите имя или ID', 'error');
                return;
            }

            setStatus('⏳ Проверка...', '');

            try {
                const response = await fetch(`${API_URL}/get-tokens`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId })
                });

                const data = await response.json();

                if (data.success) {
                    currentUser = userId;
                    userTokens = data.tokens || 0;
                    document.getElementById('tokensDisplay').textContent = userTokens;
                    document.getElementById('messagesDisplay').textContent = data.messages || 0;
                    document.getElementById('spinsDisplay').textContent = spinCount;
                    setStatus(`✅ Пользователь: ${data.username || userId}`, 'success');
                } else {
                    setStatus(`❌ ${data.error}`, 'error');
                }
            } catch (error) {
                setStatus(`❌ Ошибка: ${error.message}`, 'error');
            }
        }

        async function spendToken() {
            if (!currentUser) {
                setStatus('❌ Сначала проверьте пользователя!', 'error');
                return false;
            }

            if (userTokens < 1) {
                setStatus(`❌ Недостаточно токенов! У вас ${userTokens}`, 'error');
                return false;
            }

            try {
                const response = await fetch(`${API_URL}/spend-token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentUser })
                });

                const data = await response.json();

                if (data.success) {
                    userTokens = data.tokens;
                    document.getElementById('tokensDisplay').textContent = userTokens;
                    spinCount++;
                    document.getElementById('spinsDisplay').textContent = spinCount;
                    setStatus(`✅ ${data.message}`, 'success');
                    return true;
                } else {
                    setStatus(`❌ ${data.error}`, 'error');
                    return false;
                }
            } catch (error) {
                setStatus(`❌ Ошибка: ${error.message}`, 'error');
                return false;
            }
        }

        async function giveRole(roleName) {
            if (!currentUser) {
                setStatus('❌ Пользователь не найден', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/give-role`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentUser, roleName })
                });

                const data = await response.json();

                if (data.success) {
                    if (data.alreadyHas) {
                        document.getElementById('winTokens').textContent = `✅ У вас уже есть эта роль!`;
                    } else {
                        document.getElementById('winTokens').textContent = `✅ Роль "${roleName}" выдана!`;
                    }
                } else {
                    document.getElementById('winTokens').textContent = `❌ ${data.error || 'Ошибка выдачи'}`;
                }
            } catch (error) {
                document.getElementById('winTokens').textContent = `❌ Ошибка: ${error.message}`;
            }
        }

        // ===== ФУНКЦИИ РУЛЕТКИ (продолжение) =====
        function createConfetti() {
            const container = document.getElementById('confettiContainer');
            const colors = ['#f7971e', '#ffd200', '#57F287', '#ED4245', '#FEE75C', '#EB459E', '#f7971e', '#ffd200'];

            for (let i = 0; i < 80; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                const size = Math.random() * 8 + 4;
                const color = colors[Math.floor(Math.random() * colors.length)];
                const left = Math.random() * 100;
                const duration = Math.random() * 2 + 2;
                const delay = Math.random() * 1.5;

                confetti.style.cssText = `
                    left: ${left}%;
                    width: ${size}px;
                    height: ${size * 1.5}px;
                    background: ${color};
                    border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
                    animation-duration: ${duration}s;
                    animation-delay: ${delay}s;
                    transform: rotate(${Math.random() * 360}deg);
                `;
                container.appendChild(confetti);
            }

            setTimeout(() => {
                container.innerHTML = '';
            }, 4500);
        }

        function showWinOverlay(itemName) {
            const overlay = document.getElementById('winOverlay');
            const sub = document.getElementById('winSub');
            sub.textContent = `🎯 Вы выиграли: ${itemName}`;
            document.getElementById('winTokens').textContent = `💰 Осталось: ${userTokens} токенов`;
            overlay.classList.add('show');
            createConfetti();

            // Выдаём роль
            giveRole(itemName);

            setTimeout(() => {
                overlay.classList.remove('show');
            }, 4500);
        }

        function stopRoulette() {
            if (!isSpinning) return;

            isSpinning = false;
            isStopping = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }

            document.getElementById('startBtn').disabled = false;
            document.getElementById('startBtn').textContent = '🎲 Крутить (1 токен)';

            setTimeout(() => {
                const winnerIdx = findWinnerIndex();
                const winner = items[winnerIdx];

                const activeCard = track.querySelector('.card.active');
                if (activeCard) {
                    activeCard.style.transition = 'box-shadow 0.3s ease';
                    activeCard.style.boxShadow = '0 0 80px rgba(247, 151, 30, 0.9), 0 0 150px rgba(247, 151, 30, 0.5)';

                    let pulseCount = 0;
                    const pulseInterval = setInterval(() => {
                        if (pulseCount > 5) {
                            clearInterval(pulseInterval);
                            activeCard.style.boxShadow = '';
                            return;
                        }
                        activeCard.style.transform = pulseCount % 2 === 0 ? 'scale(1.2)' : 'scale(1.15)';
                        pulseCount++;
                    }, 200);
                }

                showWinOverlay(winner.name);

            }, 100);
        }

        function animateRoulette(timestamp) {
            if (!isSpinning) {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
                return;
            }

            if (isStopping) {
                speed *= 0.997;
                if (speed < 0.05) {
                    stopRoulette();
                    return;
                }
            }

            currentX -= speed;
            track.style.transform = `translateX(${currentX}px)`;
            updateActiveCard();

            if (Math.floor(timestamp / 100) % 3 === 0) {
                reflowCards();
            }

            animationId = requestAnimationFrame(animateRoulette);
        }

        async function startRoulette() {
            if (isSpinning) return;

            // Проверяем токены
            if (!currentUser) {
                setStatus('❌ Сначала проверьте пользователя!', 'error');
                return;
            }

            const canSpin = await spendToken();
            if (!canSpin) return;

            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }

            document.getElementById('winOverlay').classList.remove('show');
            document.getElementById('confettiContainer').innerHTML = '';

            isSpinning = true;
            isStopping = false;

            speed = Math.random() * 8 + 12;
            const spinDuration = Math.random() * 5000 + 3000;

            document.getElementById('startBtn').disabled = true;
            document.getElementById('startBtn').textContent = '⏳ Крутится...';

            animateRoulette(0);

            setTimeout(() => {
                if (isSpinning) {
                    isStopping = true;
                    document.getElementById('startBtn').textContent = '🔄 Останавливается...';
                }
            }, spinDuration);
        }

        function resetRoulette() {
            if (isSpinning) {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
                isSpinning = false;
                isStopping = false;
                speed = 0;
            }

            currentX = 0;
            track.style.transform = 'translateX(0px)';

            const cards = track.querySelectorAll('.card');
            const sortedCards = Array.from(cards).sort((a, b) => {
                return parseInt(a.dataset.index) - parseInt(b.dataset.index);
            });

            sortedCards.forEach((card, i) => {
                card.dataset.realIndex = i % items.length;
                track.appendChild(card);
            });

            document.getElementById('winOverlay').classList.remove('show');
            document.getElementById('confettiContainer').innerHTML = '';

            document.getElementById('startBtn').disabled = false;
            document.getElementById('startBtn').textContent = '🎲 Крутить (1 токен)';

            document.querySelectorAll('.card').forEach(card => {
                card.style.boxShadow = '';
                card.style.transform = '';
            });

            setTimeout(findWinnerIndex, 100);
        }

        function setStatus(text, type) {
            const el = document.getElementById('statusMessage');
            el.textContent = text;
            el.className = 'status ' + (type || '');
        }

        // ===== ОБРАБОТЧИКИ =====
        document.getElementById('checkBtn').addEventListener('click', checkUser);
        document.getElementById('startBtn').addEventListener('click', startRoulette);
        document.getElementById('resetBtn').addEventListener('click', resetRoulette);

        document.getElementById('userId').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                checkUser();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' && !isSpinning) {
                e.preventDefault();
                startRoulette();
            }
            if (e.key === 'r' || e.key === 'R') {
                resetRoulette();
            }
        });

        // Загрузка сохранённого пользователя
        const savedUser = localStorage.getItem('discordUser');
        if (savedUser) {
            document.getElementById('userId').value = savedUser;
            checkUser();
        }

        document.getElementById('userId').addEventListener('change', function() {
            localStorage.setItem('discordUser', this.value.trim());
        });

        setTimeout(findWinnerIndex, 200);
        window.addEventListener('resize', () => {
            if (!isSpinning) {
                findWinnerIndex();
            }
        });

        console.log('🎰 Дискорд рулетка с токенами запущена!');
        console.log('💬 За 10 сообщений = 1 токен');
        console.log('🎯 1 спин = 1 токен');
    </script>

</body>
</html>
