<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 Дискорд Рулетка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        .header {
            padding: 20px 40px;
            background: linear-gradient(180deg, rgba(10,10,10,1) 0%, rgba(10,10,10,0.7) 100%);
            z-index: 10;
            position: sticky;
            top: 0;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, #5865F2, #7289DA, #5865F2);
            background-size: 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s infinite;
            letter-spacing: 2px;
        }

        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        .header p {
            color: #888;
            font-size: 0.9rem;
            letter-spacing: 3px;
            margin-top: 5px;
        }

        /* ----- Остальные стили такие же как в прошлой версии ----- */
        .roulette-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0a 100%);
        }

        .roulette-track {
            display: flex;
            gap: 30px;
            padding: 0 50px;
            position: relative;
            will-change: transform;
        }

        .card {
            flex: 0 0 280px;
            height: 400px;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            transform: scale(0.85);
            opacity: 0.4;
            filter: blur(3px);
        }

        .card.active {
            transform: scale(1.15);
            opacity: 1;
            filter: blur(0px);
            box-shadow: 0 20px 60px rgba(88, 101, 242, 0.4), 0 0 80px rgba(88, 101, 242, 0.2);
            z-index: 5;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px 20px 20px;
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, transparent 100%);
            transform: translateY(30px);
            opacity: 0;
            transition: all 0.5s ease;
        }

        .card.active .overlay {
            transform: translateY(0);
            opacity: 1;
        }

        .card .overlay h3 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .card .overlay p {
            font-size: 0.9rem;
            color: #ccc;
            opacity: 0.8;
        }

        .card .badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(88, 101, 242, 0.95);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
            transform: scale(0) rotate(-30deg);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .card.active .badge {
            transform: scale(1) rotate(0deg);
        }

        .card.active::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 26px;
            background: linear-gradient(90deg, #5865F2, #7289DA, #5865F2);
            background-size: 300%;
            animation: borderGlow 2s linear infinite;
            z-index: -1;
        }

        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            align-items: center;
            z-index: 20;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 14px 40px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(90deg, #5865F2, #7289DA);
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 5px 30px rgba(88, 101, 242, 0.3);
        }

        .btn:hover:not(:disabled) {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 10px 50px rgba(88, 101, 242, 0.5);
        }

        .btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-reset {
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 5px 30px rgba(118, 75, 162, 0.3);
        }

        .counter {
            color: #888;
            font-size: 0.9rem;
            letter-spacing: 1px;
            padding: 8px 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            min-width: 160px;
            text-align: center;
        }

        .counter span {
            color: #7289DA;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            opacity: 0;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-100px) rotate(0deg) scale(0);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg) scale(1);
                opacity: 0;
            }
        }

        .win-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 500;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .win-overlay.show {
            opacity: 1;
        }

        .win-text {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(90deg, #5865F2, #7289DA, #5865F2);
            background-size: 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 1s infinite;
            text-shadow: 0 0 60px rgba(88, 101, 242, 0.3);
            transform: scale(0);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .win-overlay.show .win-text {
            transform: scale(1);
        }

        .win-sub {
            font-size: 1.5rem;
            color: #fff;
            -webkit-text-fill-color: white;
            margin-top: 10px;
        }

        .footer {
            padding: 12px 40px;
            text-align: center;
            color: #333;
            font-size: 0.7rem;
            letter-spacing: 2px;
            background: rgba(10,10,10,0.9);
            border-top: 1px solid #1a1a1a;
        }

        .footer span {
            color: #5865F2;
        }

        /* Панель для ввода ID пользователя */
        .user-panel {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            background: rgba(0,0,0,0.8);
            padding: 15px 25px;
            border-radius: 16px;
            border: 1px solid rgba(88, 101, 242, 0.3);
            backdrop-filter: blur(10px);
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .user-panel label {
            color: #ccc;
            font-size: 0.9rem;
        }

        .user-panel input {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: white;
            font-size: 0.9rem;
            min-width: 200px;
        }

        .user-panel input:focus {
            outline: none;
            border-color: #5865F2;
        }

        .user-panel .status {
            color: #7289DA;
            font-size: 0.8rem;
            min-width: 100px;
            text-align: center;
        }

        .user-panel .status.success {
            color: #57F287;
        }

        .user-panel .status.error {
            color: #ED4245;
        }

        @media (max-width: 768px) {
            .card {
                flex: 0 0 200px;
                height: 300px;
            }
            .card.active {
                transform: scale(1.1);
            }
            .header h1 {
                font-size: 1.8rem;
            }
            .controls {
                bottom: 20px;
                gap: 10px;
            }
            .btn {
                padding: 10px 24px;
                font-size: 0.9rem;
            }
            .counter {
                font-size: 0.8rem;
                min-width: 100px;
                padding: 6px 15px;
            }
            .win-text {
                font-size: 2.5rem;
            }
            .win-sub {
                font-size: 1rem;
            }
            .user-panel {
                bottom: 100px;
                padding: 10px 15px;
                width: 90%;
            }
            .user-panel input {
                min-width: 150px;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎰 ДИСКОРД РУЛЕТКА</h1>
        <p>ВЫИГРЫВАЙ РОЛИ НА СЕРВЕРЕ</p>
    </div>

    <div class="roulette-wrapper">
        <div class="roulette-track" id="rouletteTrack"></div>

        <div class="controls">
            <button class="btn" id="startBtn">🎲 Запустить</button>
            <div class="counter">Позиция: <span id="positionDisplay">0</span></div>
            <button class="btn btn-reset" id="resetBtn">🔄 Сброс</button>
        </div>
    </div>

    <!-- Панель ввода ID пользователя -->
    <div class="user-panel">
        <label for="userId">🆔 Ваш Discord ID:</label>
        <input type="text" id="userId" placeholder="Введите ваш ID (правый клик → Копировать ID)">
        <div class="status" id="statusMessage">⏳ Ожидание</div>
    </div>

    <div class="win-overlay" id="winOverlay">
        <div class="win-text">
            🎉 ПОБЕДА! 🎉
            <div class="win-sub" id="winSub">Вы выиграли: Горы</div>
            <div class="win-sub" style="font-size: 1.2rem; color: #57F287;" id="roleStatus"></div>
        </div>
    </div>

    <div class="confetti-container" id="confettiContainer"></div>

    <div class="footer">
        <span>✦</span> Введите свой Discord ID · Крутите рулетку · Получайте роли! <span>✦</span>
    </div>

    <script>
        // ===== НАСТРОЙКИ =====
        // 🚨 ИЗМЕНИТЕ ЭТОТ URL НА ВАШ СЕРВЕР!
        const API_URL = '/api/give-role';

        // Роли для рулетки (соответствуют серверным)
        const items = [
            { name: '🏔️ Роль 1', desc: 'Еёбок', badge: '⭐ ТОП' },
            { name: '🌊 Роль 2', desc: 'Еблан', badge: '🔥 ХИТ' },
            { name: '🌆 Роль 3', desc: 'Долбаёб', badge: '💎 ЛЮКС' },
        ];

        // ===== ОСТАЛЬНОЙ КОД РУЛЕТКИ =====
        const track = document.getElementById('rouletteTrack');
        const cardWidth = 310;
        let totalCards = 0;
        let currentX = 0;
        let animationId = null;
        let isSpinning = false;
        let isStopping = false;
        let speed = 0;
        let lastWinner = null;
        let isGivingRole = false;

        // Создаём карточки
        function createCards() {
            const count = Math.max(items.length * 2, 9);
            
            for (let i = 0; i < count; i++) {
                const idx = i % items.length;
                const item = items[idx];
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = i;
                card.dataset.realIndex = idx;
                const seed = idx + 1;
                card.innerHTML = `
                    <div class="badge">${item.badge}</div>
                    <img src="https://picsum.photos/seed/${seed + i * 13}/600/800" alt="${item.name}">
                    <div class="overlay">
                        <h3>${item.name}</h3>
                        <p>${item.desc}</p>
                    </div>
                `;
                track.appendChild(card);
            }
            totalCards = track.children.length;
        }
        createCards();

        function findWinnerIndex() {
            const cards = track.querySelectorAll('.card');
            const containerWidth = track.parentElement.clientWidth;
            const centerX = containerWidth / 2;

            let closestCard = null;
            let closestDist = Infinity;

            cards.forEach((card) => {
                const rect = card.getBoundingClientRect();
                const cardCenter = rect.left + rect.width / 2;
                const dist = Math.abs(cardCenter - centerX);
                
                if (dist < closestDist) {
                    closestDist = dist;
                    closestCard = card;
                }
            });

            cards.forEach(card => card.classList.remove('active'));
            if (closestCard) {
                closestCard.classList.add('active');
                const realIndex = parseInt(closestCard.dataset.realIndex);
                document.getElementById('positionDisplay').textContent = realIndex + 1;
                return realIndex;
            }
            return 0;
        }

        function updateActiveCard() {
            const cards = track.querySelectorAll('.card');
            const containerWidth = track.parentElement.clientWidth;
            const centerX = containerWidth / 2;

            let closestCard = null;
            let closestDist = Infinity;

            cards.forEach((card) => {
                const rect = card.getBoundingClientRect();
                const cardCenter = rect.left + rect.width / 2;
                const dist = Math.abs(cardCenter - centerX);
                
                if (dist < closestDist) {
                    closestDist = dist;
                    closestCard = card;
                }
            });

            cards.forEach(card => card.classList.remove('active'));
            if (closestCard) {
                closestCard.classList.add('active');
                const realIndex = parseInt(closestCard.dataset.realIndex);
                document.getElementById('positionDisplay').textContent = realIndex + 1;
            }
        }

        function reflowCards() {
            const cards = track.querySelectorAll('.card');
            
            const firstCard = cards[0];
            const firstRect = firstCard.getBoundingClientRect();
            
            if (firstRect.right < 0) {
                const movedCard = track.removeChild(firstCard);
                const lastCard = track.lastElementChild;
                const newRealIndex = (parseInt(lastCard.dataset.realIndex) + 1) % items.length;
                movedCard.dataset.realIndex = newRealIndex;
                track.appendChild(movedCard);
                
                currentX += cardWidth;
                track.style.transform = `translateX(${currentX}px)`;
            }
        }

        // ===== ВЫДАЧА РОЛИ =====
        async function giveRole(userId, roleName) {
            if (isGivingRole) return;
            isGivingRole = true;

            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = '⏳ Выдаём роль...';
            statusEl.className = 'status';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ userId, roleName }),
                });

                const data = await response.json();

                if (data.success) {
                    if (data.alreadyHas) {
                        statusEl.textContent = `✅ Уже есть "${roleName}"`;
                        statusEl.className = 'status success';
                        document.getElementById('roleStatus').textContent = `✅ У вас уже есть эта роль!`;
                    } else {
                        statusEl.textContent = `✅ Роль "${roleName}" выдана!`;
                        statusEl.className = 'status success';
                        document.getElementById('roleStatus').textContent = `✅ Роль "${roleName}" выдана!`;
                    }
                } else {
                    statusEl.textContent = `❌ ${data.error || 'Ошибка'}`;
                    statusEl.className = 'status error';
                    document.getElementById('roleStatus').textContent = `❌ ${data.error || 'Ошибка выдачи'}`;
                }
            } catch (error) {
                console.error('Ошибка:', error);
                statusEl.textContent = '❌ Ошибка соединения с сервером';
                statusEl.className = 'status error';
                document.getElementById('roleStatus').textContent = '❌ Ошибка соединения';
            }

            isGivingRole = false;
        }

        // ===== ОСТАЛЬНЫЕ ФУНКЦИИ РУЛЕТКИ =====
        function createConfetti() {
            const container = document.getElementById('confettiContainer');
            const colors = ['#5865F2', '#7289DA', '#57F287', '#ED4245', '#FEE75C', '#EB459E', '#5865F2', '#7289DA'];
            
            for (let i = 0; i < 80; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                const size = Math.random() * 8 + 4;
                const color = colors[Math.floor(Math.random() * colors.length)];
                const left = Math.random() * 100;
                const duration = Math.random() * 2 + 2;
                const delay = Math.random() * 1.5;
                
                confetti.style.cssText = `
                    left: ${left}%;
                    width: ${size}px;
                    height: ${size * 1.5}px;
                    background: ${color};
                    border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
                    animation-duration: ${duration}s;
                    animation-delay: ${delay}s;
                    transform: rotate(${Math.random() * 360}deg);
                `;
                container.appendChild(confetti);
            }

            setTimeout(() => {
                container.innerHTML = '';
            }, 4500);
        }

        function showWinOverlay(itemName) {
            const overlay = document.getElementById('winOverlay');
            const sub = document.getElementById('winSub');
            sub.textContent = `🎯 Вы выиграли: ${itemName}`;
            document.getElementById('roleStatus').textContent = '⏳ Выдача роли...';
            overlay.classList.add('show');
            createConfetti();
            
            // Автоматически выдаём роль, если введён ID
            const userId = document.getElementById('userId').value.trim();
            if (userId) {
                giveRole(userId, itemName);
            } else {
                document.getElementById('roleStatus').textContent = '⚠️ Введите Discord ID для получения роли';
            }
            
            setTimeout(() => {
                overlay.classList.remove('show');
            }, 4500);
        }

        function stopRoulette() {
            if (!isSpinning) return;
            
            isSpinning = false;
            isStopping = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            
            document.getElementById('startBtn').disabled = false;
            document.getElementById('startBtn').textContent = '🎲 Запустить';
            
            setTimeout(() => {
                const winnerIdx = findWinnerIndex();
                const winner = items[winnerIdx];
                lastWinner = winner;
                
                const activeCard = track.querySelector('.card.active');
                if (activeCard) {
                    activeCard.style.transition = 'box-shadow 0.3s ease';
                    activeCard.style.boxShadow = '0 0 80px rgba(88, 101, 242, 0.9), 0 0 150px rgba(88, 101, 242, 0.5)';
                    
                    let pulseCount = 0;
                    const pulseInterval = setInterval(() => {
                        if (pulseCount > 5) {
                            clearInterval(pulseInterval);
                            activeCard.style.boxShadow = '';
                            return;
                        }
                        activeCard.style.transform = pulseCount % 2 === 0 ? 'scale(1.2)' : 'scale(1.15)';
                        pulseCount++;
                    }, 200);
                }
                
                showWinOverlay(winner.name);
                document.getElementById('positionDisplay').textContent = winnerIdx + 1;
                
            }, 100);
        }

        function animateRoulette(timestamp) {
            if (!isSpinning) {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
                return;
            }
            
            if (isStopping) {
                speed *= 0.997;
                if (speed < 0.05) {
                    stopRoulette();
                    return;
                }
            }
            
            currentX -= speed;
            track.style.transform = `translateX(${currentX}px)`;
            updateActiveCard();
            
            if (Math.floor(timestamp / 100) % 3 === 0) {
                reflowCards();
            }
            
            animationId = requestAnimationFrame(animateRoulette);
        }

        function startRoulette() {
            if (isSpinning) return;
            
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            
            document.getElementById('winOverlay').classList.remove('show');
            document.getElementById('confettiContainer').innerHTML = '';
            document.getElementById('roleStatus').textContent = '';
            
            isSpinning = true;
            isStopping = false;
            
            speed = Math.random() * 8 + 12;
            const spinDuration = Math.random() * 5000 + 3000;
            
            document.getElementById('startBtn').disabled = true;
            document.getElementById('startBtn').textContent = '⏳ Крутится...';
            
            animateRoulette(0);
            
            setTimeout(() => {
                if (isSpinning) {
                    isStopping = true;
                    document.getElementById('startBtn').textContent = '🔄 Останавливается...';
                }
            }, spinDuration);
        }

        function resetRoulette() {
            if (isSpinning) {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
                isSpinning = false;
                isStopping = false;
                speed = 0;
            }
            
            currentX = 0;
            track.style.transform = 'translateX(0px)';
            
            const cards = track.querySelectorAll('.card');
            const sortedCards = Array.from(cards).sort((a, b) => {
                return parseInt(a.dataset.index) - parseInt(b.dataset.index);
            });
            
            sortedCards.forEach((card, i) => {
                card.dataset.realIndex = i % items.length;
                track.appendChild(card);
            });
            
            document.getElementById('winOverlay').classList.remove('show');
            document.getElementById('confettiContainer').innerHTML = '';
            document.getElementById('roleStatus').textContent = '';
            
            document.getElementById('startBtn').disabled = false;
            document.getElementById('startBtn').textContent = '🎲 Запустить';
            
            document.querySelectorAll('.card').forEach(card => {
                card.style.boxShadow = '';
                card.style.transform = '';
            });
            
            setTimeout(findWinnerIndex, 100);
        }

        // ===== ОБРАБОТЧИКИ =====
        document.getElementById('startBtn').addEventListener('click', startRoulette);
        document.getElementById('resetBtn').addEventListener('click', resetRoulette);

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                if (!isSpinning) {
                    startRoulette();
                }
            }
            if (e.key === 'r' || e.key === 'R') {
                resetRoulette();
            }
        });

        // Сохраняем ID пользователя в localStorage
        document.getElementById('userId').addEventListener('change', function() {
            localStorage.setItem('discordUserId', this.value.trim());
        });

        // Загружаем сохранённый ID
        const savedId = localStorage.getItem('discordUserId');
        if (savedId) {
            document.getElementById('userId').value = savedId;
        }

        setTimeout(findWinnerIndex, 200);
        window.addEventListener('resize', () => {
            if (!isSpinning) {
                findWinnerIndex();
            }
        });

        console.log('🎰 Дискорд рулетка запущена!');
        console.log('📌 Введите свой Discord ID и крутите рулетку!');
    </script>

</body>
</html>
